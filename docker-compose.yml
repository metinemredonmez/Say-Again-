# Yerel gelistirme icin PostgreSQL. Calistir: docker compose up -d db
# Buradaki kullanici ve sifre yalnizca yerel gelistirme icindir; baska hicbir yerde kullanma.
services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sayagain
      POSTGRES_PASSWORD: sayagain
      POSTGRES_DB: say_again
    volumes:
      - ./db/data:/var/lib/postgresql/data
