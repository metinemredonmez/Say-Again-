name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; the workflow only checks code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, test, e2e, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      # A real PostgreSQL server for a second e2e run (the first runs on in-process PGlite).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: say_again_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions are pinned to release commits (OPS-04); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
      - name: e2e on PostgreSQL
        run: npm run test:e2e -- --no-file-parallelism
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/say_again_test
      - run: npm run build

  # The mobile job (type check and lint) is added with the first mobile task, after the Expo
  # template screens are replaced; the template itself does not pass the type check.
